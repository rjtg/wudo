[package]
name = "wudo-webauthn-experiment"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately independent: no dependency is added to the privileged daemon.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
webauthn-rs = { version = "=0.5.5", default-features = false }
webauthn-rs-proto = { version = "=0.5.5", default-features = false }
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

serde_json = "1"
wudo-protocol = { path = "../../crates/wudo-protocol", features = ["v2"] }
openssl = "0.10"
webauthn-rs-core = { version = "=0.5.5", default-features = false }
