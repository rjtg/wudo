[package]
name = "wudo-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wudo-protocol = { path = "../../crates/wudo-protocol", features = ["v2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "Event", "EventTarget", "Navigator", "CredentialsContainer", "CredentialCreationOptions", "PublicKeyCredential", "AuthenticatorAttestationResponse", "Response", "RequestInit", "RequestMode", "RequestCredentials", "RequestRedirect", "Headers", "Location", "Crypto", "SubtleCrypto", "AbortController", "AbortSignal", "DomException"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
