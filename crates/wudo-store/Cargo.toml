[package]
name = "wudo-store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "limits"] }
rusqlite_migration = { version = "2.6", default-features = false }
getrandom = "0.4"
rustix = { version = "1", default-features = false, features = ["process", "std"] }

webauthn-rs = { version = "=0.5.5", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
