[package]
name = "wudod"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "net", "process", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "signal", "macros"] }
wudo-protocol = { version = "0.1.0", path = "../wudo-protocol", features = ["v2"] }

wudo-store = { path = "../wudo-store" }

[dev-dependencies]
tempfile = "3"

[dependencies.webauthn-rs]
version = "=0.5.5"
default-features = false

[dependencies.webauthn-rs-proto]
version = "=0.5.5"

[dependencies.openssl]
version = "0.10"

[dependencies.getrandom]
version = "0.4"

[dev-dependencies.webauthn-authenticator-rs]
version = "=0.5.5"
default-features = false
features = ["softpasskey"]

[dev-dependencies.serde_json]
version = "1"

[dependencies.base64]
version = "0.21"

[dev-dependencies.rusqlite]
version = "0.40"
default-features = false
features = ["bundled"]
